<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transição de Animações - Three.js</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #1a1a1a; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        #info { 
            position: absolute; 
            top: 20px; 
            width: 100%; 
            text-align: center; 
            color: #ffffff; 
            pointer-events: none; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        #instructions {
            position: absolute; 
            bottom: 20px; 
            width: 100%; 
            text-align: center; 
            color: #aaaaaa; 
            font-size: 14px;
            pointer-events: none; 
        }
    </style>
    <!-- Importando o Three.js via CDN com Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">
        <h2>Demonstração: Transição de Animações no Three.js</h2>
        <p>Aguarde o cubo terminar de "pular" (Animação 1) para ele começar a "girar" (Animação 2) com transição suave.</p>
    </div>
    <div id="instructions">Você pode usar o mouse para girar a câmera (OrbitControls)</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        // Se for usar FBX depois, você importaria assim:
        // import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

        // ==========================================
        // 1. CONFIGURAÇÃO BÁSICA DA CENA
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a2a2a);
        scene.fog = new THREE.Fog(0x2a2a2a, 10, 50);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 100);
        camera.position.set(0, 5, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1, 0);
        controls.update();

        // ==========================================
        // 2. ILUMINAÇÃO E AMBIENTE
        // ==========================================
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(-3, 10, -10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 10;
        dirLight.shadow.camera.bottom = -10;
        dirLight.shadow.camera.left = -10;
        dirLight.shadow.camera.right = 10;
        dirLight.shadow.camera.near = 0.1;
        dirLight.shadow.camera.far = 40;
        scene.add(dirLight);

        // Chão e Grade
        const mesh = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100), 
            new THREE.MeshPhongMaterial({ color: 0x999999, depthWrite: false })
        );
        mesh.rotation.x = -Math.PI / 2;
        mesh.receiveShadow = true;
        scene.add(mesh);

        const grid = new THREE.GridHelper(100, 40, 0x000000, 0x000000);
        grid.material.opacity = 0.2;
        grid.material.transparent = true;
        scene.add(grid);

        // ==========================================
        // 3. OBJETO E ANIMAÇÕES (MOCK PARA DEMONSTRAÇÃO)
        // ==========================================
        // Para usar seus arquivos FBX do Mixamo, você substituiria esta parte pelo FBXLoader.
        
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshStandardMaterial({ color: 0x0088ff, roughness: 0.2 });
        const cube = new THREE.Mesh(geometry, material);
        cube.position.y = 1;
        cube.castShadow = true;
        scene.add(cube);

        const mixer = new THREE.AnimationMixer(cube);

        // ANIMAÇÃO 1: Um pulo (Vai tocar apenas uma vez)
        const positionKF = new THREE.VectorKeyframeTrack('.position', 
            [0, 1, 2], // Tempos (0s, 1s, 2s)
            [0, 1, 0,  0, 6, 0,  0, 1, 0] // Posições XYZ
        );
        const animacaoPulo = new THREE.AnimationClip('Pulo', 2, [positionKF]);

        // ANIMAÇÃO 2: Rotação (Vai tocar em loop depois do pulo)
        const xAxis = new THREE.Vector3(0, 1, 0);
        const q1 = new THREE.Quaternion().setFromAxisAngle(xAxis, 0);
        const q2 = new THREE.Quaternion().setFromAxisAngle(xAxis, Math.PI);
        const q3 = new THREE.Quaternion().setFromAxisAngle(xAxis, Math.PI * 2);
        const quaternionKF = new THREE.QuaternionKeyframeTrack('.quaternion', 
            [0, 1, 2], 
            [q1.x, q1.y, q1.z, q1.w, q2.x, q2.y, q2.z, q2.w, q3.x, q3.y, q3.z, q3.w]
        );
        const animacaoGiro = new THREE.AnimationClip('Giro', 2, [quaternionKF]);

        // Criando as Actions
        const acao1 = mixer.clipAction(animacaoPulo);
        const acao2 = mixer.clipAction(animacaoGiro);

        // ==========================================
        // 4. LÓGICA DE TRANSIÇÃO (A MÁGICA ACONTECE AQUI)
        // ==========================================
        
        // Configura a Animação 1 para não repetir e parar no final
        acao1.setLoop(THREE.LoopOnce);
        acao1.clampWhenFinished = true;
        acao1.play(); // Inicia a primeira animação

        // Escuta o evento 'finished' do mixer
        mixer.addEventListener('finished', function (evento) {
            // Verifica se a animação que terminou foi a Ação 1
            if (evento.action === acao1) {
                
                acao2.reset(); 
                acao2.setLoop(THREE.LoopRepeat); // Esta ficará em loop
                acao2.play();
                
                // Faz o CrossFade (Transição) de 0.5 segundos da Ação 1 para a Ação 2
                acao1.crossFadeTo(acao2, 0.5, false);
            }
        });

        // ==========================================
        // 5. LOOP DE RENDERIZAÇÃO
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            
            renderer.render(scene, camera);
        }
        animate();

        // Tratamento de redimensionamento da janela
        window.addEventListener('resize', onWindowResize);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
