<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamante Legacy</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

        // ==========================================
        // 1. CENA E CÂMERA (Escala real para Mixamo)
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.Fog(0x1a1a1a, 200, 1000);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
        // Câmera inicial de frente para o personagem (Z = 400, Y = 100 altura do peito)
        camera.position.set(0, 100, 400); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 100, 0); // Foca no centro do personagem
        controls.enableDamping = true;
        controls.update();

        // LUZES
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
        hemiLight.position.set(0, 200, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(100, 200, 100);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // ==========================================
        // 2. CARREGAMENTO DO FBX (DIAMANTE LEGACY)
        // ==========================================
        let mixer, acao1, acao2;
        let moverCamera = false;
        
        // Posição final da câmera: X=150 (Direita), Y=120 (Levemente mais alto), Z=200 (Zoom perto do rosto/peito)
        const posicaoCameraAlvo = new THREE.Vector3(150, 120, 200);

        const loader = new FBXLoader();

        // 1. Carrega o modelo principal com a primeira animação (ex: Idle ou Início)
        loader.load('Button Pushing.fbx', (personagem) => {
            personagem.scale.set(1, 1, 1); // Mixamo geralmente já vem na escala certa, mas pode ajustar aqui
            
            // Adiciona sombras
            personagem.traverse(function (child) {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            scene.add(personagem);

            mixer = new THREE.AnimationMixer(personagem);
            
            // Pega a primeira animação do arquivo principal
            acao1 = mixer.clipAction(personagem.animations[0]);
            acao1.setLoop(THREE.LoopOnce); // Toca só uma vez
            acao1.clampWhenFinished = true;
            
            // 2. Carrega o arquivo FBX que contém SÓ a segunda animação (o texto que você tentou mesclar)
            loader.load('Angry.fbx', (animacaoFBX) => {
                
                acao2 = mixer.clipAction(animacaoFBX.animations[0]);
                acao2.setLoop(THREE.LoopRepeat); // Essa fica em loop

                // Inicia a primeira animação
                acao1.play();

                // Lógica de transição ao terminar a primeira animação
                mixer.addEventListener('finished', (evento) => {
                    if (evento.action === acao1) {
                        acao2.reset();
                        acao2.play();
                        
                        // Crossfade de 0.5 segundos para a nova animação
                        acao1.crossFadeTo(acao2, 0.5, false);

                        // GATILHO DA CÂMERA: Inicia o Zoom e arrasta para a direita
                        moverCamera = true;
                    }
                });
            });
        });

        // ==========================================
        // 3. LOOP DE RENDERIZAÇÃO E CÂMERA
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            if (mixer) mixer.update(delta);

            // Transição cinematográfica da câmera
            if (moverCamera) {
                // Interpola a câmera atual para a posição alvo suavemente (velocidade 1.5)
                camera.position.lerp(posicaoCameraAlvo, 1.5 * delta);
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();

        // Ajusta a tela quando redimensionar o navegador
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
